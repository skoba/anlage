# rake demo:reset のサンプルのカルテ記録（skoba/anlage#144、R-20261125-9 で承認）。
# docs/design/sample-data-plan.md 3 節の表と 1 行ずつ対応する（row は表の #）。値は合成、患者は架空。臨床文書ではない。
#
# date: 記録日。09:00（日本時間）に保存したものとして入れる（OBSERVATION のイベント時刻と context/start_time）
# 項目の名前は Demo::SampleCompositions::FIELDS で帳票の入力欄の名前に写す。
# certainty（診断確度）は OPT の値集合のコード: at0074 疑い／at0075 推定／at0076 確定（ProblemList.opt・jp_referral.opt）
# icd11: ICD-11 MMS のコード。5A11（2型糖尿病）だけを使う（設計書 2 節の 4、問い 2）
# jp_referral: テンプレートを登録しないので、構造骨格（spec/fixtures/compositions/jp_referral/skeleton.canonical.json）の
#   複製の値を差し替えて RM グラフにだけ入れる（設計書 2 節の 6）。department は紹介先の診療科
#   form: true の紹介状（DEMO-07〜09、設計書 7 節、R-20261126-11）は、骨格を使わず、jp_referral.opt から作った
#   テンプレート（保存しない）で帳票と同じ組み立てを使い、項目を埋めて RM グラフにだけ入れる（7.5 の問い 6）。
#   sender は紹介元、receiver は紹介先、purpose は紹介目的、history は既往歴及び家族歴、synopsis は症状経過及び検査結果、
#   treatment は治療経過。医師の氏名は書かない
