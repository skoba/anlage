# 測定（接地あり・なし）に使う問いの文。docs/design/s4-nl-aql-plan.md 5.2 節（Q4・Q5）。
# レビュー（Kobayashi, Shinji、2026-11-27）の結果を、裁定 R-20261127-26 で確定した。
# 評価 v2 のゴールド（spec/fixtures/evaluation/v2/*.yml）は変えていない。このファイルは、その外に置く
# （v2 のディレクトリの *.yml は、評価がそのまま読むため）。ここの本体（nl_query、正解の行）は人間の専有領域。変更は人間のレビューを経る。
#
# queries の形式:
#   id        n<元の問いの番号>-<連番>。もとの問いが無いもの（検査の 2 問）は n1xx
#   base      もとの aql の問い（v2 の id）。期待行・selection は、下の「正解の行」の決まりで引く
#   style     base（測定用の文。もとの query に、出す列を書き足したもの）／chart（カルテに書く言葉）／
#             explain（患者や非専門家に説明する言葉）／modeling（アーキタイプやテンプレートの言葉）／
#             tuning（指示文の調整用。測定に使わない。期待行は無い）
#   tags      分けて数えるための印: abbrev（略語）／value_paraphrase（値の言い換え。主の数字とは別に数える）／
#             named_template（テンプレートを名指しした文）
#   nl_query  LLM に渡す問いの文
#   notes     採点の注意
#   sorted_column  行の順を見る問いの、並んでいるはずの列（0 から数える）。向きと、同じ値どうしの順は問わない（n013-2 だけ。R-20261128-3）
#
# 正解の行の決まり（上から順に当てる）:
#   1. 問いが expected_rows を持てば、それ（名指しの文、検査の 2 問）
#   2. base が both_versions にあれば、blood_pressure の v1 と v2 の両方を引いた行（rows_by_archetype の 2 つを合わせたもの）が正解。
#      片方の版だけの行と一致した答えは、不正解と分けて「見落とし」に数える（正解・見落とし・不正解の 3 つ）。
#      版の列は持たない（採点は、答えに版の列があれば落として比べる）
#   3. それ以外は、base の問いの expected_rows（v2 のゴールド）
# 行は、順序を見ない多重集合として比べる（sorted_column を持つ問いだけ、行の順も見る）。列の順は見る（文に出てくる順）。
# ここの行は、demo_initial（rake demo:reset の初期状態）での実測（anlage main 2206f74。spec/lib/evaluation/nl_queries_spec.rb が固定する）。

reviewed_by: Kobayashi, Shinji
reviewed_at: 2026-11-27

# テンプレートを名指ししない血圧の問いの正解（R-20261127-26 の 1）。
# a009 は、v1 に当たる記録が無いので、両方を引いた行と v2 だけの行が同じになる（見落としを見分けられない）
both_versions:
  a001:
    rows_by_archetype:
      openEHR-EHR-OBSERVATION.blood_pressure.v1: [[162.0], [158.0], [146.0], [142.0]]
      openEHR-EHR-OBSERVATION.blood_pressure.v2: [[148.0], [152.0]]
  a009:
    rows_by_archetype:
      openEHR-EHR-OBSERVATION.blood_pressure.v1: []
      openEHR-EHR-OBSERVATION.blood_pressure.v2: [[88.0, 54.0], [96.0, 60.0]]
  a010:
    rows_by_archetype:
      openEHR-EHR-OBSERVATION.blood_pressure.v1: [[162.0, 78.0], [158.0, 76.0], [146.0, 74.0], [142.0, 68.0]]
      openEHR-EHR-OBSERVATION.blood_pressure.v2: [[148.0, 86.0], [152.0, 92.0], [132.0, 94.0], [128.0, 92.0]]
  a011:
    rows_by_archetype:
      openEHR-EHR-OBSERVATION.blood_pressure.v1: [[162.0], [158.0], [146.0], [142.0]]
      openEHR-EHR-OBSERVATION.blood_pressure.v2: [[148.0], [152.0], [88.0], [96.0]]

queries:
  - { id: n001-1, base: a001, style: base,
      nl_query: "収縮期血圧が 140 mmHg 以上の記録の、収縮期血圧の値" }
  - { id: n001-2, base: a001, style: chart, tags: [abbrev],
      nl_query: "SBP 140 以上の記録の、SBP の値" }
  - { id: n001-3, base: a001, style: explain,
      nl_query: "上の血圧が 140 以上だった記録について、上の血圧の値" }
  - id: n001-4
    base: a001
    style: base
    tags: [named_template]
    nl_query: "テンプレート CardiologyEncounter の記録のうち、収縮期血圧が 140 mmHg 以上の記録の、収縮期血圧の値"
    expected_rows: [[148.0], [152.0]]
    selection:
      columns:
        - { archetype_id: openEHR-EHR-OBSERVATION.blood_pressure.v2, at_code: at0004 }
      conditions:
        - card: { archetype_id: openEHR-EHR-OBSERVATION.blood_pressure.v2, at_code: at0004 }
          operator: ">="
          value: 140
    notes: "名指ししたテンプレートだけが正解（blood_pressure.v2）"
  - id: n001-5
    base: a001
    style: base
    tags: [named_template]
    nl_query: "テンプレート patient_blood_pressure.v1 の記録のうち、収縮期血圧が 140 mmHg 以上の記録の、収縮期血圧の値"
    expected_rows: [[162.0], [158.0], [146.0], [142.0]]
    selection:
      columns:
        - { archetype_id: openEHR-EHR-OBSERVATION.blood_pressure.v1, at_code: at0004 }
      conditions:
        - card: { archetype_id: openEHR-EHR-OBSERVATION.blood_pressure.v1, at_code: at0004 }
          operator: ">="
          value: 140
    notes: "名指ししたテンプレートだけが正解（blood_pressure.v1。カードのラベルは英語の「Systolic」）"

  - { id: n002-1, base: a002, style: base,
      nl_query: "診断確度が「疑い」の傷病の、傷病名" }
  - { id: n002-2, base: a002, style: chart,
      nl_query: "疑い病名の一覧" }
  - { id: n002-3, base: a002, style: modeling,
      nl_query: "プロブレム・診断のうち、診断確度が「疑い」のものの、プロブレム・診断名" }

  - { id: n003-1, base: a003, style: base,
      nl_query: "病名が「2型糖尿病」または「高血圧症」の記録の、病名。記録の出所（どの文書の記録か）つきで" }
  - { id: n003-2, base: a003, style: chart,
      nl_query: "2型糖尿病か高血圧症がついている記録について、どの文書の記録かと、病名" }

  - { id: n004-1, base: a004, style: base,
      nl_query: "分析名が「空腹時血糖」の検査の、分析結果の値" }
  - { id: n004-2, base: a004, style: chart,
      nl_query: "空腹時血糖の結果" }
  - { id: n004-3, base: a004, style: chart, tags: [abbrev, value_paraphrase],
      nl_query: "FBS の値",
      notes: "値の言い換え（FBS → 空腹時血糖）。記録にある文字は「空腹時血糖」で、カードの文には無い。成績は、主の数字とは別に数える" }

  - { id: n005-1, base: a005, style: base,
      nl_query: "身長が 170 cm 以上の記録の、身長の値" }
  - { id: n005-2, base: a005, style: explain,
      nl_query: "背の高さが 170 センチ以上の記録について、身長" }

  - { id: n006-1, base: a006, style: base,
      nl_query: "病名に「糖尿病」を含む記録の、病名。記録の出所（どの文書の記録か）つきで" }
  - { id: n006-2, base: a006, style: chart,
      nl_query: "糖尿病がつく病名を、どの文書の記録かと一緒に" }
  - { id: n006-3, base: a006, style: modeling,
      nl_query: "プロブレム・診断名が「糖尿病」を含むものを、テンプレートの ID つきで。プロブレム・診断名を表示" }

  - { id: n009-1, base: a009, style: base,
      nl_query: "収縮期血圧が 100 mmHg 未満の記録の、収縮期血圧と拡張期血圧の値" }
  - { id: n009-2, base: a009, style: chart, tags: [abbrev],
      nl_query: "SBP 100 未満の記録の、SBP と DBP" }
  - { id: n009-3, base: a009, style: explain,
      nl_query: "上の血圧が 100 に届かない記録について、上の血圧と下の血圧" }

  - { id: n010-1, base: a010, style: base,
      nl_query: "収縮期血圧が 140 mmHg 以上、または拡張期血圧が 90 mmHg 以上の記録の、収縮期血圧と拡張期血圧の値" }
  - { id: n010-2, base: a010, style: chart,
      nl_query: "収縮期 140 以上か拡張期 90 以上の記録の、収縮期と拡張期" }
  - { id: n010-3, base: a010, style: explain,
      nl_query: "上の血圧が 140 以上か、下の血圧が 90 以上の記録について、上の血圧と下の血圧" }

  - { id: n011-1, base: a011, style: base,
      nl_query: "収縮期血圧が 100 mmHg より低いか、139 mmHg より高い記録の、収縮期血圧の値" }
  - { id: n011-2, base: a011, style: chart,
      nl_query: "収縮期が 100〜139 を外れている記録の、収縮期の値" }

  - { id: n012-1, base: a012, style: base,
      nl_query: "診断確度が「確定」か、診断確度の記載が無い傷病の、傷病名。記録の出所（どの文書の記録か）つきで" }
  - { id: n012-2, base: a012, style: chart,
      nl_query: "確定病名（確度の記載が無いものも含む）を、どの文書の記録かと一緒に" }

  - { id: n013-1, base: a013, style: base,
      nl_query: "発症日時が 2025 年（2025-01-01 から、2026-01-01 の前まで）の傷病の、傷病名と発症日時。記録の出所（どの文書の記録か）つきで" }
  - { id: n013-2, base: a013, style: explain, sorted_column: 2,
      nl_query: "2025年に発症したと記録されている病名について、発症日とどの文書に記録されているかと一緒に示す。文書種別と病名、発症日の一覧を発症日の順番に並べてください。",
      notes: "小林の文。列の順は、文書種別（template_id）、病名、発症日。もとの文は「病名と文書種別、発症日の一覧」で、列の順と食い違うので、文の側を直した（R-20261127-26 の 2）。行の順を見る（sorted_column: 2 = 3 つめの列の発症日。R-20261128-3）。向き（昇順か降順か）と、同じ発症日の行どうしの順は、問わない" }
  - { id: n013-3, base: a013, style: explain,
      nl_query: "2025 年のあいだに発症した病気について、病名と、発症した日時。どの文書の記録かも" }

  - { id: n014-1, base: a014, style: base,
      nl_query: "アーキタイプの版をまたいで、収縮期血圧が 140 mmHg 以上の記録の、収縮期血圧の値",
      notes: "版をまたぐ問いは、接地なしの腕と AQL を書く腕の比較から外し、選択を出す腕だけで別に数える（計画書 5.2 節）" }
  - { id: n014-2, base: a014, style: explain,
      nl_query: "血圧の記録の様式の、古い版と新しい版をまたいで、収縮期血圧が 140 以上の記録の、収縮期血圧の値" }

  # 検査の問い（R-20261127-26 の 3）。分析名と数値の 2 つの条件
  - id: n101-1
    base: null
    style: base
    nl_query: "分析名が「ヘモグロビン」で、分析結果が 10 g/dL 以下の検査の、分析結果の値"
    expected_rows: [[9.8], [8.9], [9.4]]
    selection: &hemoglobin
      columns:
        - { archetype_id: openEHR-EHR-CLUSTER.laboratory_test_analyte.v1, at_code: at0001 }
      conditions:
        - card: { archetype_id: openEHR-EHR-CLUSTER.laboratory_test_analyte.v1, at_code: at0024 }
          operator: "="
          value: "ヘモグロビン"
        - card: { archetype_id: openEHR-EHR-CLUSTER.laboratory_test_analyte.v1, at_code: at0001 }
          operator: "<="
          value: 10
  - id: n101-2
    base: null
    style: chart
    tags: [abbrev, value_paraphrase]
    nl_query: "Hb 10 以下の記録の、Hb の値"
    expected_rows: [[9.8], [8.9], [9.4]]
    selection: *hemoglobin
    notes: "記録にある分析名は「ヘモグロビン」。Hb は値の言い換えにあたるので、主の数字とは別に数える"
  - id: n102-1
    base: null
    style: base
    nl_query: "分析名が「HbA1c」で、分析結果が 7 % 以上の検査の、分析結果の値"
    expected_rows: [[8.1], [7.6], [7.2], [7.0]]
    selection: &hba1c
      columns:
        - { archetype_id: openEHR-EHR-CLUSTER.laboratory_test_analyte.v1, at_code: at0001 }
      conditions:
        - card: { archetype_id: openEHR-EHR-CLUSTER.laboratory_test_analyte.v1, at_code: at0024 }
          operator: "="
          value: "HbA1c"
        - card: { archetype_id: openEHR-EHR-CLUSTER.laboratory_test_analyte.v1, at_code: at0001 }
          operator: ">="
          value: 7
  - id: n102-2
    base: null
    style: chart
    nl_query: "HbA1c 7 以上の記録の、HbA1c の値"
    expected_rows: [[8.1], [7.6], [7.2], [7.0]]
    selection: *hba1c

  # 指示文の調整に使う問い（測定には使わない。計画書 5.6 節）。期待行は無い
  - { id: t001, base: null, style: tuning,
      nl_query: "拡張期血圧が 90 mmHg 以上の記録の、拡張期血圧の値" }
  - { id: t002, base: null, style: tuning,
      nl_query: "診断確度が「推定」の傷病の、傷病名" }
  - { id: t003, base: null, style: tuning,
      nl_query: "体重が 60 kg 以上の記録の、体重の値" }
