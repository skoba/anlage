# 評価 v2 のゴールド（card 種）。docs/design/s1-eval-v2-plan.md 2.1・4・7 節。
# 臨床レビュー（Kobayashi, Shinji、2026-11-24）の結果を裁定 R-20261124-15 で確定した。案は R-20261124-11 作業列 3。
# 確定した問いは active（採点の母数）。pending は正解がコーパスに無い保留問で、母数に入らない。
# ゴールド本体（query／expected／acceptable／forbidden／notes）は人間の専有領域。変更は人間のレビューを経る。
#
# 形式: id / kind: card / status（既定 active）/ query / expected（期待集合。{archetype_id, at_code, rank}。rank は順位で
#       1 が最上位、同じ順位を複数に付けてよい。rank の無い問いは全要素が同じ順位）/ match（card = at_code まで見る。
#       archetype = archetype_id のみ）/ acceptable（許容。正解でも誤りでもなく、上位に出てよい候補）/
#       forbidden（負例。top-3 に出たら負例違反）/ intent_tag / pending_until / notes / reviewed_by / reviewed_at。
#       アーキタイプ ID と at-code は spec/fixtures/pathcards/*.golden.json の実物。

