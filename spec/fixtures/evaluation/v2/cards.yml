  reviewed_by:
  reviewed_at:

# --- 負例（bigram の偽陽性を系統的に集める。forbidden が top-3 に出たら負例違反）

- id: c015
  kind: card
  status: draft
  query: "臨床検査"
  expected:
    - { archetype_id: openEHR-EHR-OBSERVATION.laboratory_test_result.v1 }
  match: archetype
  forbidden:
    - { archetype_id: openEHR-EHR-EVALUATION.problem_diagnosis.v1, at_code: at0003 }
  intent_tag: 複合語
  notes: "v1 q15 の旧クエリ。bigram「臨床」で ProblemList at0003「臨床的に認識された日時」が 1 位を占めた偽陽性（wp4-eval-log）を負例として保存する案。【人間に問う】2026-08-25 のレビューは「臨床検査 → laboratory_test_result の単一固定は広→狭の恣意」として旧クエリを廃した。期待集合を laboratory_test_result（archetype 一致）に置くことが、その判断と両立するか。両立しないなら、負例だけの問い（expected 空）を形式に足すかを決める"
  reviewed_by:
  reviewed_at:

