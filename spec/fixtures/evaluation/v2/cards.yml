# 評価 v2 のゴールド（card 種）の案。docs/design/s1-eval-v2-plan.md 2.1・4 節、裁定 R-20261124-11 作業列 3。
# すべて status: draft か pending（採点の母数に入らない）。v1 の seed（spec/fixtures/pathcards_eval_seed.yml）は変更していない。
# ここに置いたのは、v1 の注記（人間レビュー 2026-08-24〜26）に書かれた要求を v2 の形式に写した案で、
# 確定時に v1 側の該当問をどう扱うか（v1 に残す／v2 に移す）も人間の判断。
#
# 形式: id / kind: card / status / query / expected（期待集合。{archetype_id, at_code}）/ match（card = at_code まで見る。
#       archetype = archetype_id のみ）/ forbidden（負例。top-3 に出たら負例違反）/ intent_tag / pending_until / notes /
#       reviewed_by / reviewed_at。アーキタイプ ID と at-code は spec/fixtures/pathcards/*.golden.json の実物。
#
# 人間レビューの範囲: 問いの文言と期待集合・負例の臨床的妥当性。intent_tag の付け方は v1 と同じ（技術分類、レビュー対象外）。

