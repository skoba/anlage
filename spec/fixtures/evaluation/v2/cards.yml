  notes: "v1 q10 の注記「期待集合 {at0004, at0005} の第 1 号」を形式にした。recall@3 で両要素が上位に並ぶかを測る（v1 の hit は片方で成立）"
  reviewed_by: Kobayashi, Shinji
  reviewed_at: 2026-11-24

