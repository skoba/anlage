# --- 保留問（正解がコーパスに無い。期待先のアーキタイプが active のカードに現れると報告で「保留解除候補」になる）

- id: c021
  kind: card
  status: pending
  query: "既往歴"
  expected:
    - { archetype_id: openEHR-EHR-OBSERVATION.story.v1, at_code: at0004, rank: 1 }
    - { archetype_id: openEHR-EHR-EVALUATION.problem_diagnosis.v1, rank: 1 }
  match: card
  intent_tag: 同義語ギャップ
  pending_until: "jp_referral（OBSERVATION.story.v1 を含む）が demo_initial の索引に入る（いまは壇上で登録するため初期状態に含めない）"
  notes: "v1 の q21（draft）を v2 に移した（v1 からは消した）。レビュー（2026-11-24、小林）: 既往歴の記録のしかたは 2 通りある── 叙述として書くもの（OBSERVATION.story）と、problem_diagnosis の形で過去の病名を並べるもの。どちらも正解で、同じ順位。負例は置かない。割合の目安は story 系が約 8 割、problem list が約 2 割（v1 q18 の注記）。jp_referral の story ルート名「既往歴及び家族歴」に container_labels で着地する想定（referral-intake-log R8）"
  reviewed_by: Kobayashi, Shinji
  reviewed_at: 2026-11-24

