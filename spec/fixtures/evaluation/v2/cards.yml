- id: c008
  kind: card
  query: "発症"
  expected:
    - { archetype_id: openEHR-EHR-EVALUATION.problem_diagnosis.v1, at_code: at0077, rank: 1 }
    - { archetype_id: openEHR-EHR-EVALUATION.problem_diagnosis.v1, at_code: at0002, rank: 2 }
  match: card
  intent_tag: bigram成立想定
  notes: "v1 q08 の注記（主文脈 at0077 発症日時、少数文脈 at0002 プロブレム・診断名）。レビュー（2026-11-24）: 第 1 候補は発症日時（at0077）、第 2 候補はプロブレム・診断名（at0002）。順位つきにする理由（小林）: 該当するアーキタイプや要素を示唆したり抽出したりする用途が、今後増える"
  reviewed_by: Kobayashi, Shinji
  reviewed_at: 2026-11-24

# --- 負例（bigram の偽陽性を系統的に集める。forbidden が top-3 に出たら負例違反）

- id: c015
  kind: card
  query: "臨床検査"
  expected:
    - { archetype_id: openEHR-EHR-OBSERVATION.laboratory_test_result.v1, rank: 1 }
  match: archetype
  acceptable: []
  forbidden:
    - { archetype_id: openEHR-EHR-EVALUATION.problem_diagnosis.v1, at_code: at0003 }
  intent_tag: 複合語
  notes: "v1 q15 の旧クエリ。レビュー（2026-11-24、小林）: 広い語として扱う。laboratory_test_result が優先だが、心電図、呼吸機能、認知機能検査なども含む語で、広く抽出されるべき。第 1 候補は laboratory_test_result（archetype 一致）。許容（acceptable）は検査の結果を表すほかのアーキタイプ（種類: 心電図、呼吸機能、認知機能検査など）── いまのコーパスには該当するアーキタイプが無いので ID は空。該当するアーキタイプがコーパスに入ったら、人間のレビューを経て ID を足す。負例は bigram「臨床」で 1 位を占めた ProblemList at0003「臨床的に認識された日時」（wp4-eval-log の偽陽性）"
  reviewed_by: Kobayashi, Shinji
  reviewed_at: 2026-11-24

