# 評価 v2 のゴールド（aql 種、S2 の経路つき）。docs/design/s1-eval-v2-plan.md 8 節。
# 2026-11-26 に 7 問を確定した（裁定 R-20261126-5。案は R-20261125-6・R-20261125-10、ゲート報告は docs/reports/s2-query-builder-log.md R28）。
# ゴールド本体（query／reference_aql／expected_rows／notes）は人間の専有領域。変更は人間のレビューを経る。
#
# サンプルデータ（患者 6 人・65 件。docs/design/sample-data-plan.md 3 節）の上の問い。旧い案の a007・a008 は置き換えた（番号は使い回さない）。
#
# 形式は aql.yml と同じで、selection（クエリビルダーへの入力）を持つ（同 8.1・8.4・8.5）:
#   selection.columns / selection.conditions（card・operator・value。未記入を含む include_missing、範囲の外 OUTSIDE、どちらかを満たす any）/
#   selection.template_id（出所のテンプレート）/ selection.across_versions（版をまたいで引く。参照は reference_aqls に版ごと）
# 採点は 2 通り: 参照 AQL が expected_rows を返すか（ゴールドの健全性）、selection からビルダーが組んだ AQL が同じ行を返すか（S2 の経路）。
#
# 2026-11-26: 出所の列を、Composition 名（c/name/value）から template_id（c/archetype_details/template_id/value）に切り替えた
#   （裁定 R-20261126-8。a006・a012・a013。期待行は実測で変わらない）。
#
# 閾値は、サンプルデータの「判定の目安」（docs/design/sample-data-plan.md）を使った: 高い = 収縮期 140 以上または拡張期 90 以上、低い = 収縮期 100 未満。
# アーキタイプ ID と at-code は実物。期待行は demo_initial での実測。

- id: a006
  kind: aql
  query: "病名に「糖尿病」を含む記録を、出所の文書名つきで"
  dataset: demo_initial
  reference_aql: |
    SELECT c/archetype_details/template_id/value AS template_id,
           ev/data[at0001]/items[at0002]/value/value AS diagnosis
    FROM EHR e CONTAINS COMPOSITION c CONTAINS EVALUATION ev[openEHR-EHR-EVALUATION.problem_diagnosis.v1]
    WHERE ev/data[at0001]/items[at0002]/value/value LIKE "*糖尿病*"
  expected_rows: [["ProblemList", "2型糖尿病"], ["ProblemList", "2型糖尿病"], ["ProblemList", "糖尿病性腎症"], ["jp_referral", "2型糖尿病"]]
  cards:
    - { archetype_id: openEHR-EHR-EVALUATION.problem_diagnosis.v1, at_code: at0002 }
  selection:
    columns:
      - { archetype_id: openEHR-EHR-EVALUATION.problem_diagnosis.v1, at_code: at0002 }
    conditions:
      - card: { archetype_id: openEHR-EHR-EVALUATION.problem_diagnosis.v1, at_code: at0002 }
        operator: CONTAINS
        value: "糖尿病"
    template_id: true
  notes: "病名の部分一致（文字列の包含。AQL の LIKE は glob で、*糖尿病* と書く）。当たるのは 2型糖尿病 3 件（ProblemList 2、紹介状 1）と糖尿病性腎症 1 件。**部分一致はつなぎで、本来はコードで引く**（R-20261125-6）: いまのデータでコードを持つのは DEMO-01 の 2型糖尿病（ICD-11 5A11）だけで、DEMO-05 の 2型糖尿病はコードが無い。字面で引くと、別の病名（糖尿病性腎症）も当たる。レビュー（R-20261126-5）: つなぎの問いとして置く"
  reviewed_by: Kobayashi, Shinji
  reviewed_at: 2026-11-26

- id: a009
  kind: aql
  query: "収縮期血圧が 100 mmHg 未満（低血圧）の記録の、収縮期と拡張期"
  dataset: demo_initial
  reference_aql: |
    SELECT o/data[at0001]/events[at0006]/data[at0003]/items[at0004]/value/magnitude AS systolic,
           o/data[at0001]/events[at0006]/data[at0003]/items[at0005]/value/magnitude AS diastolic
    FROM EHR e CONTAINS COMPOSITION c CONTAINS OBSERVATION o[openEHR-EHR-OBSERVATION.blood_pressure.v2]
    WHERE o/data[at0001]/events[at0006]/data[at0003]/items[at0004]/value/magnitude < 100
  expected_rows: [[88.0, 54.0], [96.0, 60.0]]
  cards:
    - { archetype_id: openEHR-EHR-OBSERVATION.blood_pressure.v2, at_code: at0004 }
    - { archetype_id: openEHR-EHR-OBSERVATION.blood_pressure.v2, at_code: at0005 }
  selection:
    columns:
      - { archetype_id: openEHR-EHR-OBSERVATION.blood_pressure.v2, at_code: at0004 }
      - { archetype_id: openEHR-EHR-OBSERVATION.blood_pressure.v2, at_code: at0005 }
    conditions:
      - card: { archetype_id: openEHR-EHR-OBSERVATION.blood_pressure.v2, at_code: at0004 }
        operator: "<"
        value: 100
  notes: "低血圧（数値の上限。2 列の射影）。blood_pressure.v2 の 11 件のうち、DEMO-03 の 88/54 と 96/60 の 2 件。104/66 は外れる。v1 の記録は入らない（版をまたぐのは a014）。閾値はサンプルデータの「判定の目安」（低い = 収縮期 100 未満）を使った（R-20261126-5）"
  reviewed_by: Kobayashi, Shinji
  reviewed_at: 2026-11-26

- id: a010
  kind: aql
  query: "収縮期血圧が 140 mmHg 以上、または拡張期血圧が 90 mmHg 以上（高血圧）の記録の、収縮期と拡張期"
  dataset: demo_initial
  reference_aql: |
    SELECT o/data[at0001]/events[at0006]/data[at0003]/items[at0004]/value/magnitude AS systolic,
           o/data[at0001]/events[at0006]/data[at0003]/items[at0005]/value/magnitude AS diastolic
    FROM EHR e CONTAINS COMPOSITION c CONTAINS OBSERVATION o[openEHR-EHR-OBSERVATION.blood_pressure.v2]
    WHERE (o/data[at0001]/events[at0006]/data[at0003]/items[at0004]/value/magnitude >= 140 OR o/data[at0001]/events[at0006]/data[at0003]/items[at0005]/value/magnitude >= 90)
  expected_rows: [[148.0, 86.0], [152.0, 92.0], [132.0, 94.0], [128.0, 92.0]]
  cards:
    - { archetype_id: openEHR-EHR-OBSERVATION.blood_pressure.v2, at_code: at0004 }
    - { archetype_id: openEHR-EHR-OBSERVATION.blood_pressure.v2, at_code: at0005 }
  selection:
    columns:
      - { archetype_id: openEHR-EHR-OBSERVATION.blood_pressure.v2, at_code: at0004 }
      - { archetype_id: openEHR-EHR-OBSERVATION.blood_pressure.v2, at_code: at0005 }
    conditions:
      - any:
          - { card: { archetype_id: openEHR-EHR-OBSERVATION.blood_pressure.v2, at_code: at0004 }, operator: ">=", value: 140 }
          - { card: { archetype_id: openEHR-EHR-OBSERVATION.blood_pressure.v2, at_code: at0005 }, operator: ">=", value: 90 }
  notes: "高血圧（どちらかを満たす。別々の項目の条件を OR でつなぐ）。blood_pressure.v2 の 11 件のうち 4 件: 収縮期だけ高い 148/86、両方高い 152/92、拡張期だけ高い 132/94 と 128/92。条件が効いていないと 11 件、収縮期だけで引くと 2 件、拡張期だけで引くと 3 件になる。a001（収縮期 140 以上）との違いは、拡張期だけ高い 2 件が入ること。閾値はサンプルデータの「判定の目安」（高い = 収縮期 140 以上または拡張期 90 以上）を使った（R-20261126-5）"
  reviewed_by: Kobayashi, Shinji
  reviewed_at: 2026-11-26

- id: a011
  kind: aql
  query: "収縮期血圧が 100〜139 mmHg の範囲の外（低いか高い）の記録"
  dataset: demo_initial
  reference_aql: |
    SELECT o/data[at0001]/events[at0006]/data[at0003]/items[at0004]/value/magnitude AS systolic
    FROM EHR e CONTAINS COMPOSITION c CONTAINS OBSERVATION o[openEHR-EHR-OBSERVATION.blood_pressure.v2]
    WHERE (o/data[at0001]/events[at0006]/data[at0003]/items[at0004]/value/magnitude < 100 OR o/data[at0001]/events[at0006]/data[at0003]/items[at0004]/value/magnitude > 139)
  expected_rows: [[148.0], [152.0], [88.0], [96.0]]
  cards:
    - { archetype_id: openEHR-EHR-OBSERVATION.blood_pressure.v2, at_code: at0004 }
  selection:
    columns:
      - { archetype_id: openEHR-EHR-OBSERVATION.blood_pressure.v2, at_code: at0004 }
    conditions:
      - card: { archetype_id: openEHR-EHR-OBSERVATION.blood_pressure.v2, at_code: at0004 }
        operator: OUTSIDE
        value: { low: 100, high: 139 }
  notes: "範囲の外（1 つの項目で、下限より低い、または上限より高い）。血圧は低くても高くても問題なので、両方を 1 回で引く（R-20261125-6）。blood_pressure.v2 の 11 件のうち、低い 88・96 と、高い 148・152 の 4 件。範囲 100〜139 は、サンプルデータの「判定の目安」（140 以上を高い、100 未満を低い）から置いた（R-20261126-5）"
  reviewed_by: Kobayashi, Shinji
  reviewed_at: 2026-11-26

- id: a012
  kind: aql
  query: "確定の病名（診断確度の記載が無いものを含む）を、出所の文書名つきで"
  dataset: demo_initial
  reference_aql: |
    SELECT c/archetype_details/template_id/value AS template_id,
           ev/data[at0001]/items[at0002]/value/value AS diagnosis
    FROM EHR e CONTAINS COMPOSITION c CONTAINS EVALUATION ev[openEHR-EHR-EVALUATION.problem_diagnosis.v1]
    WHERE (ev/data[at0001]/items[at0073]/value/defining_code/code_string MATCHES {"at0076"} OR NOT EXISTS ev/data[at0001]/items[at0073]/value)
  expected_rows:
    - ["ProblemList", "2型糖尿病"]
    - ["ProblemList", "糖尿病性腎症"]
    - ["ProblemList", "高血圧症"]
    - ["ProblemList", "高血圧症"]
    - ["ProblemList", "鉄欠乏性貧血"]
    - ["ProblemList", "脂質異常症"]
    - ["ProblemList", "慢性腎臓病"]
    - ["ProblemList", "2型糖尿病"]
    - ["ProblemList", "花粉症"]
    - ["jp_referral", "2型糖尿病"]
  cards:
    - { archetype_id: openEHR-EHR-EVALUATION.problem_diagnosis.v1, at_code: at0002 }
    - { archetype_id: openEHR-EHR-EVALUATION.problem_diagnosis.v1, at_code: at0073 }
  selection:
    columns:
      - { archetype_id: openEHR-EHR-EVALUATION.problem_diagnosis.v1, at_code: at0002 }
    conditions:
      - card: { archetype_id: openEHR-EHR-EVALUATION.problem_diagnosis.v1, at_code: at0073 }
        operator: MATCHES
        value: [at0076]
        include_missing: true
    template_id: true
  notes: "確定の病名（未記入を含む。値集合の条件に、その項目が書かれていない記録を OR で足す）。日本語では、病名に「疑い」が付いていなければ確定（小林、2026-11-25）。確度を書かない文書（紹介状）の傷病名も、確定の病名として引く。傷病 15 件のうち 10 件: 確度が「確定」（at0076）の 9 件と、確度の記載が無い紹介状の 1 件（DEMO-01 の 2型糖尿病）。外れるのは「疑い」4 件と「推定」1 件。未記入を含めないと 9 件になる。レビュー（R-20261126-5）: 問いはそのまま。DEMO-05 の紹介状の「狭心症」は、人物像では「狭心症の疑い」での紹介なので、サンプルデータの側に診断確度「疑い」を足した（案の時点では確度の記載が無く、期待行は 11 行だった）"
  reviewed_by: Kobayashi, Shinji
  reviewed_at: 2026-11-26

- id: a013
  kind: aql
  query: "発症が 2025 年の病名を、出所の文書名と発症日時つきで"
  dataset: demo_initial
  reference_aql: |
    SELECT c/archetype_details/template_id/value AS template_id,
           ev/data[at0001]/items[at0002]/value/value AS diagnosis,
           ev/data[at0001]/items[at0077]/value/value AS onset
    FROM EHR e CONTAINS COMPOSITION c CONTAINS EVALUATION ev[openEHR-EHR-EVALUATION.problem_diagnosis.v1]
    WHERE ev/data[at0001]/items[at0077]/value/value >= "2025-01-01" AND ev/data[at0001]/items[at0077]/value/value < "2026-01-01"
  expected_rows:
    - ["ProblemList", "糖尿病性腎症", "2025-10-01T00:00:00Z"]
    - ["ProblemList", "狭心症", "2025-11-01T00:00:00Z"]
    - ["jp_referral", "狭心症", "2025-11-01T00:00:00Z"]
  cards:
    - { archetype_id: openEHR-EHR-EVALUATION.problem_diagnosis.v1, at_code: at0002 }
    - { archetype_id: openEHR-EHR-EVALUATION.problem_diagnosis.v1, at_code: at0077 }
  selection:
    columns:
      - { archetype_id: openEHR-EHR-EVALUATION.problem_diagnosis.v1, at_code: at0002 }
      - { archetype_id: openEHR-EHR-EVALUATION.problem_diagnosis.v1, at_code: at0077 }
    conditions:
      - card: { archetype_id: openEHR-EHR-EVALUATION.problem_diagnosis.v1, at_code: at0077 }
        operator: BETWEEN
        value: { from: "2025-01-01", to: "2026-01-01" }
    template_id: true
  notes: "発症日の範囲（日付の範囲。from 以上、to 未満）。傷病 15 件のうち、発症日時があるのは 11 件、2025 年のものは 3 件（糖尿病性腎症 2025-10-01、狭心症 2025-11-01 が ProblemList と紹介状に 1 件ずつ）。発症日時の無い 4 件（疑い・推定の高血圧症、起立性低血圧、紹介状の 2型糖尿病）は当たらない。日時は保存された形（UTC の 00:00:00）で返る"
  reviewed_by: Kobayashi, Shinji
  reviewed_at: 2026-11-26

- id: a014
  kind: aql
  query: "アーキタイプの版をまたいで、収縮期血圧が 140 mmHg 以上の記録"
  dataset: demo_initial
  reference_aqls:
    openEHR-EHR-OBSERVATION.blood_pressure.v1: |
      SELECT o/data[at0001]/events[at0006]/data[at0003]/items[at0004]/value/magnitude AS systolic
      FROM EHR e CONTAINS COMPOSITION c CONTAINS OBSERVATION o[openEHR-EHR-OBSERVATION.blood_pressure.v1]
      WHERE o/data[at0001]/events[at0006]/data[at0003]/items[at0004]/value/magnitude >= 140
    openEHR-EHR-OBSERVATION.blood_pressure.v2: |
      SELECT o/data[at0001]/events[at0006]/data[at0003]/items[at0004]/value/magnitude AS systolic
      FROM EHR e CONTAINS COMPOSITION c CONTAINS OBSERVATION o[openEHR-EHR-OBSERVATION.blood_pressure.v2]
      WHERE o/data[at0001]/events[at0006]/data[at0003]/items[at0004]/value/magnitude >= 140
  expected_rows:
    - ["openEHR-EHR-OBSERVATION.blood_pressure.v1", 162.0]
    - ["openEHR-EHR-OBSERVATION.blood_pressure.v1", 158.0]
    - ["openEHR-EHR-OBSERVATION.blood_pressure.v1", 146.0]
    - ["openEHR-EHR-OBSERVATION.blood_pressure.v1", 142.0]
    - ["openEHR-EHR-OBSERVATION.blood_pressure.v2", 148.0]
    - ["openEHR-EHR-OBSERVATION.blood_pressure.v2", 152.0]
  cards:
    - { archetype_id: openEHR-EHR-OBSERVATION.blood_pressure.v2, at_code: at0004 }
  selection:
    across_versions: true
    columns:
      - { archetype_id: openEHR-EHR-OBSERVATION.blood_pressure.v2, at_code: at0004 }
    conditions:
      - card: { archetype_id: openEHR-EHR-OBSERVATION.blood_pressure.v2, at_code: at0004 }
        operator: ">="
        value: 140
  notes: "版をまたいで引く（R-20261125-10）。blood_pressure の v1（patient_blood_pressure、6 件）と v2（CardiologyEncounter、11 件）の収縮期を、対応の表（config/version_mappings.yml の at0004）で束ねる。140 以上は v1 の 4 件と v2 の 2 件。a001（v2 だけ）は 2 件で、v1 の 4 件を取りこぼす。先頭の列は、行が来たアーキタイプの ID（版つき。R-20261126-5 でこの形に決めた）。1 本の AQL では書けない（docs/upstream-candidates.md 29 項）ので、参照も版ごとに持つ"
  reviewed_by: Kobayashi, Shinji
  reviewed_at: 2026-11-26
