# パスカード検索評価ハーネス（WP4）のゴールドスタンダード。
# skoba/anlage#14 裁定（2026-08-24）に基づく。
#
# 各エントリ:
#   id: 一意識別子
#   query: 日本語クエリ文字列（一部英語混じりを含む、実際のクエリ想定）
#   expected_archetype_id: 正解archetype_id（原文プロンプト「正解アーキタイプ」に対応。
#     単一ラベル評価——このarchetype_idを持つカードが1枚でも結果に含まれれば正解）
#   expected_at_code: 正解at_code（任意。特定のカード1枚を指したい場合のみ指定。
#     未指定の場合はarchetype_id一致のみで判定する）
#   intent_tag: 出題意図タグ（bigram成立想定 / 複合語 / 同義語ギャップ）
#     - bigram成立想定: クエリがカードのlabel/description/code_list labelと直接的に
#       bigram一致し、成立が見込まれるもの
#     - 複合語: クエリがカードの短い抽出ラベルより長い複合語で、単純な文字列完全一致
#       ではなくbigramのOR一致で救われることを確認する意図のもの
#     - 同義語ギャップ: 実カードのテキストと字面上の手がかりが無く、Phase 1
#       （bigram）では原理的に成立しない、失敗を意図的に含めたもの
#   source: wp3-reused（docs/reports/wp3-log.md R1で個別に実測・記録済みの
#     クエリを流用） / new（本ハーネスのために新規追加）
#   notes: 補足（複数archetypeがヒットしうる場合の注記、フィールド経由の注記等）
#   reviewed_by: 人間レビュー実施者（未レビューは空欄のまま）
#   reviewed_at: レビュー日（未レビューは空欄のまま）
#
# 人間レビューの対象範囲（skoba/anlage#12裁定3）: 各クエリの文言と正解ラベルの
# 臨床的妥当性のみ。intent_tagの分類自体（bigram成立の技術的成否）はWP3実測に
# 基づくため、レビュー対象に含めない。失敗想定の同義語ギャップ問題は意図的な
# 収録であり、削除ではなくクエリ文言・正解ラベルの妥当性確認のみ求める。

