# パスカード検索の別名表（S3 の段 D。docs/design/s3-search-plan.md 3.1、案は docs/design/s3-alias-table-proposal.md）。
# 人間がレビューした行だけを入れる。行を足す・変えるときは、案を出して人間のレビューを経る（reviewed_by・reviewed_at を書く）。
# 用語マスターなど、ライセンスのある内容は入れない。
#
# term:      問いの語。問いの全体がこの語と同じときだけ引く（部分一致では引かない。空白・全角半角・英字の大小は区別しない）
# relation:  alias（対応させる。対応先のカードを先に出す）／exclude（対応させない。対応先のカードを結果から外す）
# status:    active（既定）／pending（保留。検索には使わない。pending_until に条件を書く）
# targets:   対応先。上から順に出す。at_code を省くと、そのアーキタイプのカードすべて
# source:    出どころ

# --- 対応させる

